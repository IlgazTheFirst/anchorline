name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and domain tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Bundled CLI is up to date
        run: |
          npm run build:cli
          git diff --exit-code -- skills/anchorline/scripts/anchorline.mjs || (echo "Run npm run build:cli and commit the result." && exit 1)
      - name: CLI smoke test
        run: |
          node skills/anchorline/scripts/anchorline.mjs --version
          node skills/anchorline/scripts/anchorline.mjs plan --from Example --tz Europe/London --depart 2031-02-01 --nights 10 --beach-nights 4 > /dev/null
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser journeys (production build, desktop and mobile)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
